server:
  port: 8081
  servlet:
    context-path: /
  name: microservicoecadastrarclient
  datasource:
    url: jdbc:postgresql://localhost:5433/client
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      format_sql: true
output:
  ansi:
    enabled: ALWAYS

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

main:
  web-application-type: servlet

boot:
  run:
    jvmArguments: --add-opens=java.base/java.time=ALL-UNNAMED

jwt:
  secret: your-very-secure-and-long-secret-key

flyway:
  enabled: true
  database-type: postgresql
  locations: classpath:db/migration
  ignore-unsupported: true

